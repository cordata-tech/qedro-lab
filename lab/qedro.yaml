# ACME Finanz GmbH's configuration for the lab, written the way an organisation
# writes one on the first afternoon, as in qedro's demo.
#
# Airflow and dbt-ol put every job in the `acme` namespace, so each rule names the
# domain a job belongs to. The newsletter export's art30-emit job emits its own
# purpose and legal basis, so no rule covers `acme.crm/newsletter-export`; the
# Airflow task wrapping it is mapped like any other.

controller:
  name: ACME Finanz GmbH
  contact: datenschutz@acme-finanz.example
  dpo: Erika Mustermann, Datenschutzbeauftragte
  representative: ACME Finanz GmbH, Musterstraße 1, 00000 Musterstadt

domains:
  - crm
  - billing
  - fraud

jobs:
  "acme/acme.marts.acme.crm_*":
    purpose: customer-administration
    legal_basis: contract
    domain: crm

  "acme/acme.marts.acme.billing_*":
    purpose: invoicing
    legal_basis: contract
    domain: billing

  # The run that wraps the models. It reads and writes nothing itself.
  "acme/dbt-run-acme":
    domain: crm

  # The DAG's tasks.
  "acme/acme_daily.load_raw":
    purpose: customer-administration
    legal_basis: contract
    domain: crm

  "acme/acme_daily.daily_revenue":
    purpose: invoicing
    legal_basis: contract
    domain: billing

  # The fund feed's tasks. Their own lineage goes to events/funds, but Airflow's
  # events for the tasks come here with everything else, and would list them as
  # activities with no purpose. Fund prices and figures are about no person, so the
  # rule leaves them out and the record names them with this reason
  # (cordata-tech/qedro#65).
  "acme/fund_feed.*":
    out_of_scope: fund prices and figures, no personal data

  "acme/acme_daily.*":
    domain: crm
