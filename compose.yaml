# qedro-lab: every place qedro reads OpenLineage from, run locally, and the emitters
# that write to all of them at once.
#
#   docker compose up -d --wait              # the destinations and the warehouse
#   docker compose run --rm airflow day 1    # one day of ACME's DAG
#   docker compose run --rm lab check        # qedro against every source
#
# Every port is bound to 127.0.0.1: the emulators run with fixed, published
# credentials, which are harmless only while nothing outside this machine can
# reach them.

name: qedro-lab

x-versions:
  # Pinned so a capture can name exactly what produced it. Bump deliberately and
  # say so in the capture's README.
  marquez: &marquez marquezproject/marquez:0.51.1
  marquez-web: &marquez-web marquezproject/marquez-web:0.51.1
  postgres: &postgres postgres:16.16
  kafka: &kafka apache/kafka:4.4.0
  # MinIO stopped publishing community images, so S3 is moto's server mode.
  s3: &s3 motoserver/moto:5.2.5
  gcs: &gcs fsouza/fake-gcs-server:1.56.1
  azure: &azure mcr.microsoft.com/azure-storage/azurite:3.38.0
  # The warehouse ACME transforms in: Postgres, the nearest free stand-in for
  # Redshift, which began as a fork of it.
  warehouse: &warehouse postgres:16.16

services:
  marquez-db:
    image: *postgres
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      POSTGRES_DB: marquez
    volumes:
      - marquez-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "marquez"]
      interval: 2s
      retries: 30

  marquez:
    image: *marquez
    # Published for amd64 only, so on an arm64 machine it runs under emulation
    # and its first requests are slow.
    platform: linux/amd64
    depends_on:
      marquez-db:
        condition: service_healthy
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: marquez
      # Search indexes into OpenSearch, which the lab does not run. Left on, every
      # write first fails to reach it, which slowed the first POST past the
      # client's 5s timeout and its retries stored one event three times.
      SEARCH_ENABLED: "false"
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5001/healthcheck || exit 1"]
      interval: 3s
      retries: 60
      # A first start runs its database migrations under emulation on arm64,
      # which outran the retries above and failed `up --wait` on a fresh volume.
      start_period: 300s

  marquez-web:
    image: *marquez-web
    platform: linux/amd64
    depends_on:
      marquez:
        condition: service_healthy
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

  kafka:
    image: *kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 3s
      retries: 40

  s3:
    image: *s3
    ports:
      - "127.0.0.1:9000:5000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')\""]
      interval: 2s
      retries: 30

  gcs:
    image: *gcs
    command: ["-scheme", "http", "-port", "4443", "-external-url", "http://gcs:4443", "-backend", "memory"]
    ports:
      - "127.0.0.1:4443:4443"

  azure:
    image: *azure
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--loose", "--skipApiVersionCheck"]
    ports:
      - "127.0.0.1:10000:10000"

  warehouse:
    image: *warehouse
    environment:
      POSTGRES_USER: acme
      POSTGRES_PASSWORD: acme
      POSTGRES_DB: acme
    volumes:
      - warehouse-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "acme"]
      interval: 2s
      retries: 30

  # ACME's DAG, run one day at a time with `airflow dags test`: one process, a
  # fresh SQLite database and no scheduler, which keeps a day reproducible.
  airflow:
    build: ./airflow
    profiles: ["run"]
    entrypoint: ["/opt/airflow/day.sh"]
    depends_on: &airflow-depends
      s3:
        condition: service_healthy
      gcs:
        condition: service_started
      azure:
        condition: service_started
      warehouse:
        condition: service_healthy
      marquez:
        condition: service_healthy
      kafka:
        condition: service_healthy
    env_file: lab/emulators.env
    environment: &airflow-env
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # 30s by default. A fresh container discovers its providers on the first
      # import, and while Marquez ran its migrations under emulation that took
      # longer, so day 1 failed before any task ran.
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "180"
      AIRFLOW__OPENLINEAGE__CONFIG_PATH: /lab/openlineage.yml
      AIRFLOW__OPENLINEAGE__NAMESPACE: acme
      # 10s by default. Marquez under emulation took up to 36s to accept one event,
      # and an emission stopped part-way leaves the destinations disagreeing; this
      # outlasts the HTTP transport's own 120s in openlineage.yml.
      AIRFLOW__OPENLINEAGE__EXECUTION_TIMEOUT: "180"
      # 20s by default: how long a task that succeeded keeps its process for
      # listeners. Under the scheduler a COMPLETE to six destinations took longer,
      # and the supervisor ended it after the first three; the rest never got it.
      AIRFLOW__CORE__TASK_SUCCESS_OVERTIME: "180"
      AIRFLOW_CONN_WAREHOUSE: postgres://acme:acme@warehouse:5432/acme
    volumes: &airflow-volumes
      - ./airflow/dags:/opt/airflow/dags:ro
      - ./airflow/day.sh:/opt/airflow/day.sh:ro
      - ./airflow/scheduled.sh:/opt/airflow/scheduled.sh:ro
      - ./lab:/lab:ro
      - ./events:/events
      - warehouse:/warehouse

  # The same DAG under Airflow's scheduler, as production runs it: each task in a
  # process of its own, and the DAG run's START emitted. `airflow dags test` does
  # neither. Its metadata lives in a Postgres of its own.
  airflow-db:
    image: *postgres
    profiles: ["scheduler"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 2s
      retries: 30

  airflow-scheduler:
    build: ./airflow
    profiles: ["scheduler"]
    command: ["standalone"]
    depends_on:
      <<: *airflow-depends
      airflow-db:
        condition: service_healthy
    env_file: lab/emulators.env
    environment:
      <<: *airflow-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    volumes: *airflow-volumes
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --local || exit 1"]
      interval: 10s
      retries: 60
      start_period: 300s

  # qedro and the check. Run on demand rather than kept up.
  lab:
    build: ./lab
    profiles: ["run"]
    depends_on:
      marquez:
        condition: service_healthy
      kafka:
        condition: service_healthy
      s3:
        condition: service_healthy
      gcs:
        condition: service_started
      azure:
        condition: service_started
    env_file: lab/emulators.env
    volumes:
      - ./lab:/lab:ro
      - ./events:/events
      - warehouse:/warehouse
      # The repository, read-only, so a capture can name every pinned version.
      - .:/repo:ro
      - ./captures:/captures

volumes:
  marquez-db:
  warehouse-db:
  warehouse:
